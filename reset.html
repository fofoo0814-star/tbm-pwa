<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TBM 안내페이지 초기화</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F6FA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',Arial,sans-serif;color:#1F2937}
    .box{width:min(420px,90%);background:#fff;border:1px solid #E5E7EB;border-radius:22px;padding:24px;text-align:center;box-shadow:0 10px 24px rgba(15,23,42,.08)}
    h1{font-size:22px;margin:0 0 10px;color:#183B7A}
    p{font-size:15px;line-height:1.6;color:#6B7280;margin:0 0 18px}
    button{border:0;border-radius:14px;background:#183B7A;color:#fff;padding:13px 18px;font-size:16px;font-weight:800;cursor:pointer;width:100%}
  </style>
</head>
<body>
  <div class="box">
    <h1>TBM 안내페이지 새로고침</h1>
    <p>기존에 저장된 화면을 정리한 후<br>최신 화면으로 이동합니다.</p>
    <button onclick="resetAndGo()">최신 화면으로 이동</button>
  </div>
  <script>
    async function resetAndGo(){
      try{
        if('serviceWorker' in navigator){
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }
        if(window.caches){
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
      }catch(e){}
      location.href = './index.html?v=60';
    }
    resetAndGo();
  </script>
</body>
</html>
